<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жұлдызды Таңдау — Әдіскерлер Жеребесі</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- CSS Animated Cosmic Starry Background (Ultra-light, Zero Lag) -->
  <div class="cosmos-bg">
    <div class="stars-layer-1"></div>
    <div class="stars-layer-2"></div>
    <div class="nebula-glow"></div>
  </div>

  <div class="app-layout">
    <!-- Compact Top Bar (Takes minimal vertical space) -->
    <header class="top-bar">
      <div class="bar-left">
        <div class="brand">
          <span class="brand-star">⭐</span>
          <span class="brand-name">ЖҰЛДЫЗДЫ ТАҢДАУ</span>
        </div>
        <div class="counter-badge">
          <span>Қалған жұлдыздар:</span>
          <strong id="remaining-count">20</strong>
          <span class="total-span">/ 20</span>
        </div>
      </div>

      <div class="bar-center">
        <span class="turn-prompt" id="turn-indicator">Әдіскер, қалаған жұлдызыңызды таңдаңыз! ✨</span>
      </div>

      <div class="bar-right">
        <button id="btn-sound-toggle" class="nav-btn icon-only" title="Дыбысты қосу/өшіру">
          <span id="sound-icon">🔊</span>
        </button>
        <button id="btn-results" class="nav-btn" title="Нәтижелерді көру">
          <span>📋 Нәтижелер</span>
          <span class="badge" id="results-count">0</span>
        </button>
        <button id="btn-reset" class="nav-btn reset-btn" title="Қайта бастау">
          🔄 Қайта бастау
        </button>
      </div>
    </header>

    <!-- 16:9 One-Screen Grid (5 columns x 4 rows = exactly 20 stars) -->
    <main class="grid-container">
      <div class="stars-fixed-grid" id="stars-grid">
        <!-- 20 Constant Stars generated by JS -->
      </div>
    </main>
  </div>

  <!-- Zoom Reveal Modal (Clean: Photo + Back button only) -->
  <div class="reveal-modal" id="reveal-modal">
    <div class="modal-overlay"></div>
    <div class="modal-box">
      <div class="star-pill-number" id="modal-star-number">⭐ Жұлдыз №1</div>
      
      <!-- Photo Container -->
      <div class="photo-frame">
        <img id="modal-photo" src="" alt="Бағыт фотосы" class="photo-img">
      </div>

      <!-- Prominent "Артқа" Button -->
      <button id="btn-back" class="btn-back">
        <span class="arrow-icon">⬅</span>
        <span>АРТҚА</span>
      </button>
    </div>
  </div>

  <!-- Results Modal -->
  <div class="results-modal" id="results-modal">
    <div class="results-overlay" id="results-overlay"></div>
    <div class="results-box">
      <div class="results-header">
        <h3>📋 Жеребе Қорытындысы</h3>
        <button class="close-btn" id="close-results-btn">✕</button>
      </div>
      <div class="results-content">
        <table class="results-table">
          <thead>
            <tr>
              <th>№</th>
              <th>Жұлдыз</th>
              <th>Бағыты</th>
              <th>Фотосы</th>
            </tr>
          </thead>
          <tbody id="results-tbody">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
      <div class="results-footer">
        <button id="btn-copy-results" class="copy-btn">📋 Көшіріп алу</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
